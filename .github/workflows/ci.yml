name: Phonemaster CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Validate Cloud Functions JavaScript
        run: node --check functions/index.js

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Explain missing Firebase config
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 == '' }}
        run: |
          echo "Android build is waiting for repository secret GOOGLE_SERVICES_JSON_BASE64."
          echo "Backend validation still runs without that secret."

      - name: Restore google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        shell: bash
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          chmod 600 app/google-services.json

      - name: Lint and build debug APK
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Phonemaster-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
